services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: bassam
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - task-postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    image: python:3.11
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bassam:secret123@db:5432/taskdb
    depends_on:
      - db
    command: >
      bash -c "pip install fastapi uvicorn psycopg2-binary python-dotenv &&
               uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  task-postgres-data: